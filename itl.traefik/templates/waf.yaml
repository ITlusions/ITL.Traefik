{{- if .Values.waf.enabled }}
# OWASP ModSecurity CRS, fronted by the traefik-modsecurity-plugin middleware.
# The plugin itself is loaded via traefik.experimental.plugins in values.yaml -
# this just deploys the WAF engine the plugin proxies requests to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modsecurity-crs
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.waf.replicas }}
  selector:
    matchLabels:
      app: modsecurity-crs
  template:
    metadata:
      labels:
        app: modsecurity-crs
    spec:
      containers:
        - name: modsecurity-crs
          image: "owasp/modsecurity-crs:{{ .Values.waf.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: PARANOIA
              value: {{ .Values.waf.paranoia | quote }}
            - name: ANOMALY_INBOUND
              value: {{ .Values.waf.anomalyInbound | quote }}
            - name: ANOMALY_OUTBOUND
              value: {{ .Values.waf.anomalyOutbound | quote }}
            - name: BACKEND
              value: {{ .Values.waf.backend | quote }}
          resources:
            {{- toYaml .Values.waf.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: modsecurity-crs
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: modsecurity-crs
  ports:
    - port: 80
      targetPort: 8080
---
# modsecurity-crs is itself a reverse proxy and needs *some* backend to point
# at, even though the plugin only uses its response status/body to decide
# allow-vs-block - real traffic to the actual app is forwarded by Traefik
# separately once the WAF approves. This is never meant to serve real content.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-dummy-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf-dummy-backend
  template:
    metadata:
      labels:
        app: waf-dummy-backend
    spec:
      containers:
        - name: dummy
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: waf-dummy-backend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: waf-dummy-backend
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
